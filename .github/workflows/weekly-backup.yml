name: Weekly records backup

on:
  schedule:
    - cron: "0 20 * * 4" # Every Thursday 20:00 UTC (23:00 Saudi time) — end of the Sat-Thu work week
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Download backup archive
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          # Hardcoded rather than read from the APP_URL repository variable: that
          # variable still points at the old onrender.com subdomain, which the app
          # 301s away from now that CANONICAL_HOST (the custom domain) is
          # configured, and that was silently breaking this backup every week.
          APP_URL: https://ohs1hotel.com
        run: |
          set -euo pipefail
          curl -sSL --fail --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "X-Export-Token: ${EXPORT_TOKEN}" \
            -o backup.zip \
            "${APP_URL%/}/admin/backup"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: diriyah-ohs-backup-${{ github.run_id }}
          path: backup.zip
          retention-days: 90
