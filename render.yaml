services:
  - type: web
    name: diriyah-ohs-checklist
    runtime: python
    rootDir: render-app
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diriyah-ohs-records
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: diriyah-ohs-records
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 15
    postgresMajorVersion: "18"
    ipAllowList: []
