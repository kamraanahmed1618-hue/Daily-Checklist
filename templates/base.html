<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}1 Hotel Diriyah OHS{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

    <header class="site-header">
        <div class="header-inner">

            <div class="brand">
                <span class="project-name">1 Hotel Diriyah</span>
                <span class="department-name">Occupational Health & Safety</span>
            </div>

            <nav class="main-nav">
                <a href="{{ url_for('index') }}">New Inspection</a>
                <a href="{{ url_for('admin') }}">Records</a>
            </nav>

        </div>
    </header>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}

</body>
</html>
