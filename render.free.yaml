# Evaluation-only blueprint. Free Render Postgres databases expire after 30 days.
services:
  - type: web
    name: diriyah-ohs-checklist-demo
    runtime: python
    rootDir: render-app
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diriyah-ohs-records-demo
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: diriyah-ohs-records-demo
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []
